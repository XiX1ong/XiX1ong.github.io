baseURL = "https://xix1ong.github.io/"
title = "Phyllis Xiong"
locale = "zh-CN"
defaultContentLanguage = "zh"
hasCJKLanguage = true
timeZone = "Asia/Shanghai"
enableRobotsTXT = true
enableGitInfo = true
copyright = "Phyllis Xiong"

[pagination]
pagerSize = 10

[permalinks]
post = "/post/:slug/"
page = "/:slug/"

[taxonomies]
category = "categories"
tag = "tags"

[module]
[[module.imports]]
path = "github.com/CaiJimmy/hugo-theme-stack/v4"

[caches]
[caches.images]
dir = ":cacheDir/images"

[markup]
[markup.goldmark]
[markup.goldmark.extensions]
[markup.goldmark.extensions.passthrough]
enable = true
[markup.goldmark.extensions.passthrough.delimiters]
block = [["\\[", "\\]"], ["$$", "$$"]]
inline = [["\\(", "\\)"]]
[markup.goldmark.renderer]
unsafe = false

[markup.tableOfContents]
startLevel = 2
endLevel = 4
ordered = false

[markup.highlight]
noClasses = false
codeFences = true
guessSyntax = true
lineNos = false
tabWidth = 4

[related]
includeNewer = true
threshold = 60
toLower = false
[[related.indices]]
name = "tags"
weight = 100
[[related.indices]]
name = "categories"
weight = 200

[params]
mainSections = ["post"]
rssFullContent = true
favicon = "img/avatar.png"

[params.footer]
since = 2023
customText = ""

[params.dateFormat]
published = ":date_long"
lastUpdated = ":date_long"

[params.sidebar]
emoji = "✈️"
subtitle = "旅行记录与技术笔记"
avatar = "img/avatar.png"
compact = false

[params.article]
headingAnchor = true
math = false
toc = true
readingTime = true

[params.article.list]
showTags = true

[params.article.license]
enabled = false

[params.widgets]
homepage = [
  { type = "search" },
  { type = "archives", params = { limit = 5 } },
]
page = [{ type = "toc" }]

[params.opengraph.twitter]
card = "summary_large_image"

[params.colorScheme]
toggle = true
default = "auto"

[params.imageProcessing]
autoOrient = true

[params.imageProcessing.external]
timeout = "5s"

[params.imageProcessing.content]
enabled = true
widths = [480, 800, 1200, 1600, 2400]

[params.imageProcessing.thumbnail]
enabled = true

[params.comments]
enabled = false

[params.cookies]
enabled = false

[[menu.social]]
identifier = "github"
name = "GitHub"
url = "https://github.com/XiX1ong"
[menu.social.params]
icon = "brand-github"
